def staffApiBaseUrl = providers.gradleProperty('staffApiBaseUrl')
    .orElse('https://website.attaieproperties.com/staff-api/v1').get()
if (!staffApiBaseUrl.startsWith('https://') || staffApiBaseUrl.contains('"') || staffApiBaseUrl.contains('\\')) {
    throw new GradleException('staffApiBaseUrl must be a valid HTTPS endpoint.')
}
def signingStore = System.getenv('ATTAIE_SIGNING_STORE_FILE')
def signingPassword = System.getenv('ATTAIE_SIGNING_STORE_PASSWORD')
def signingAlias = System.getenv('ATTAIE_SIGNING_KEY_ALIAS')
def signingKeyPassword = System.getenv('ATTAIE_SIGNING_KEY_PASSWORD')

android {
    namespace = 'af.attaieproperties.sales'
    compileSdk = 35

    defaultConfig {
        applicationId = 'af.attaieproperties.sales'
        minSdk = 24
        targetSdk = 35
        versionCode = 2
        versionName = '2.0.1'

        // Shared V2 backend API endpoint (same PHP/MySQL + Firebase backend as Web)
        buildConfigField(
            'String',
            'STAFF_API_BASE_URL',
            '"' + staffApiBaseUrl + '"'
        )
    }

    buildFeatures {
        buildConfig = true
    }

    signingConfigs {
        if (signingStore && signingPassword && signingAlias && signingKeyPassword) {
            release {
                storeFile = file(signingStore)
                storePassword = signingPassword
                keyAlias = signingAlias
                keyPassword = signingKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            // An unsigned release is intentional until the owner's release identity is supplied.
            if (signingConfigs.findByName('release')) signingConfig = signingConfigs.getByName('release')
            proguardFiles(
                getDefaultProguardFile('proguard-android-optimize.txt'),
                'proguard-rules.pro'
            )
        }
        debug {
            debuggable = true
            applicationIdSuffix = '.debug'
            versionNameSuffix = '-debug'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

