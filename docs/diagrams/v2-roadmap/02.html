2" rx="8" fill="#FFFFFF" stroke="#0072BC"/><text x="56" y="96" fill="#1E293B" font-size="20">Public website / Admin</text><text x="56" y="124" fill="#475569" font-size="16">Separate website auth</text><rect x="456" y="64" width="304" height="92" rx="8" fill="#FFFFFF" stroke="#0072BC"/><text x="472" y="96" fill="#1E293B" font-size="20">Website PHP API</text><text x="472" y="124" fill="#475569" font-size="16">Catalog and inquiries</text><rect x="872" y="64" width="304" height="92" rx="8" fill="#FFFFFF" stroke="#0072BC"/><text x="888" y="96" fill="#1E293B" font-size="20">Website database</text><text x="888" y="124" fill="#475569" font-size="16">Website credentials only</text><rect x="40" y="216" width="304" height="92" rx="8" fill="#FFFFFF" stroke="#0072BC"/><text x="56" y="248" fill="#1E293B" font-size="20">Staff panels / apps</text><text x="56" y="276" fill="#475569" font-size="16">Firebase ID token</text><rect x="456" y="216" width="304" height="92" rx="8" fill="#FFFFFF" stroke="#0072BC"/><text x="472" y="248" fill="#1E293B" font-size="20">Staff PHP API</text><text x="472" y="276" fill="#475569" font-size="16">UID / role / branch</text><rect x="872" y="216" width="304" height="92" rx="8" fill="#FFFFFF" stroke="#0072BC"/><text x="888" y="248" fill="#1E293B" font-size="20">Internal CRM DB</text><text x="888" y="276" fill="#475569" font-size="16">Separate runtime user</text><text x="40" y="352" fill="#1E293B" font-size="18">Controlled publication bridge: third Submission DB → Website Admin review → Website DB</text><text x="40" y="388" fill="#475569" font-size="16">Private zone: backend source, configuration, sessions and documents outside all web roots.</text></svg></div></body></html>
